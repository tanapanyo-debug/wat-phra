# คนละบริการกับ wat-accounting (บัญชีวัด) และ wat-audit (ตรวจบัญชี)
# อย่าชี้บริการนี้ไปที่ repo บัญชีวัด และอย่าใช้ฐาน wat_accounting / wat_audit
databases:
  - name: wat-phra-db
    databaseName: wat_phra
    user: wat_phra
    plan: basic-256mb

services:
  - type: web
    name: wat-phra
    runtime: node
    plan: starter
    buildCommand: npm install --prefix server
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TRUST_PROXY
        value: "1"
      - key: PHRA_ADMIN_USER
        value: "ra_yut@hotmail.com"
      - key: PHRA_ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wat-phra-db
          property: connectionString
      # คัดค่าชุดเดียวกับ wat-accounting ใน Render Dashboard — ห้ามใส่รหัสผ่านในไฟล์นี้
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
